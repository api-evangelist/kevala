summary: >-
  Cross-cutting semantics for the Kevala platform API, established by probing the anonymous edge of
  the authenticated service. Kevala publishes no developer documentation, so only behaviours that
  can be observed without credentials are recorded here. Nothing about idempotency, pagination,
  versioning or rate limiting is documented by the provider; the unknowns below are honest unknowns,
  not inferred defaults.
stack:
  server: >-
    nginx/1.29.3 fronting Django REST Framework, behind a Google Cloud edge (responses carry
    `via: 1.1 google`).
  evidence: >-
    DRF `detail` error envelope, `Allow: GET, HEAD, OPTIONS` on /der/, DRF content negotiation
    (`?format=`), and an OpenAPI schema view served as application/vnd.oai.openapi at /der/openapi/.
authentication:
  styles: [oauth2_bearer]
  authorization_server: https://kevalaanalytics.auth0.com/
  see: authentication/kevala-authentication.yml
url_style:
  trailing_slash: required
  evidence: >-
    https://api.kevala.com/der returns 301 to /der/ (`location: /der/`). Django APPEND_SLASH is on;
    a client that does not follow redirects on non-GET verbs will break.
content_negotiation:
  supported: true

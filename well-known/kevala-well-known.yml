method: probed
source: live probes of /.well-known/ paths on every Kevala host
summary: >-
  No Kevala-controlled host serves a /.well-known/ document. www.kevala.com (Webflow) answers 404
  with an "Invalid .well-known request" stub for every path; api.kevala.com answers an nginx 404;
  app.kevala.com 302s every path into the Auth0 login. The one real discovery document found in the
  Kevala estate is the OpenID Connect configuration of the company's Auth0 tenant
  (kevalaanalytics.auth0.com) — saved below because it documents how the platform API is
  authenticated, but it is boilerplate served by Auth0 for every tenant rather than a document
  Kevala publishes on its own infrastructure.
pointer_basis: >-
  NO WellKnown pointer is emitted and NO SecurityTxt pointer is emitted. RFC 9116 is unimplemented
  and no api-catalog, ai-plugin.json or agent card exists on any Kevala host. The single 200 below
  is on a vendor-hosted identity tenant, not on kevala.com or api.kevala.com, so treating it as a
  Kevala-published well-known surface would over-credit the provider.

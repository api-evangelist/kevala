apis:
- name: Kevala Platform API — DER Metering
  description: >-
    Authenticated REST surface of the Kevala platform, mounted at https://api.kevala.com/der/ and
    implemented with Django REST Framework. Kevala's September 2024 platform release notes describe
    a "DER Metering — New portal for accessing meter status and PV generation data". The service
    publishes its own OpenAPI document at /der/openapi/ (Content-Type application/vnd.oai.openapi)
    and a ReDoc reference at /der/redoc/, but both return HTTP 403
    {"detail":"Authentication credentials were not provided."} to anonymous callers, so the
    contract could not be captured. Access tokens are issued by Kevala's Auth0 tenant for the
    audience https://api.kevala.com.
  humanURL: https://www.kevala.com/platform
  baseURL: https://api.kevala.com/der/
  tags:
  - Distributed Energy Resources
  - Metering
  - Electric Grid

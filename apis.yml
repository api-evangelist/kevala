aid: kevala
name: Kevala
description: >-
  Kevala Inc. is a San Francisco based grid intelligence company, founded in 2014, that builds a
  cloud-based electric-grid data and analytics platform for utilities, regulators and government
  agencies, renewable energy developers, and transportation electrification planners. The platform
  merges address-specific geospatial data, utility network models and hyper-granular time-series
  data into map-based analytics for integrated grid planning, distributed energy resource (DER)
  adoption forecasting, project siting, power flow analysis, locational carbon accounting,
  production cost modeling, and predictive interconnection siting metrics, with exports compatible
  with CYME, Synergi, PSS/E and OpenDSS. Kevala licenses its data and analysis by subscription and
  operates an authenticated platform API at api.kevala.com; the DER metering surface publishes an
  OpenAPI document and a ReDoc reference, but both require platform credentials and no public
  developer portal, API reference or machine-readable specification is served anonymously.
